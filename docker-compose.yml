services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: imortal_vampires_spawning_frankenstains
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./packages/db/docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d imortal_vampires_spawning_frankenstains"]
      interval: 2s
      timeout: 5s
      retries: 15

  # A local mailbox for the demo: SMTP on 3025 to deliver test emails, IMAP on 3143 to read them.
  # Any address works and any password is accepted. It keeps mail in memory only.
  mail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    ports:
      - "3025:3025"
      - "3143:3143"

volumes:
  postgres-data:
