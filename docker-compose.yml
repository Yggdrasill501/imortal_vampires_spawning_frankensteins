services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: imortal_vampires_spawning_frankenstains
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d imortal_vampires_spawning_frankenstains"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
